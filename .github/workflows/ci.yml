name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: pytest + ruff (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A suíte roda contra o mesmo banco da produção. Testar em SQLite e
    # publicar em Postgres é como ensaiar num palco e estrear em outro:
    # cascata de FK, tipos e transação se comportam diferente, e a diferença
    # só aparece no ar.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: painel
          POSTGRES_PASSWORD: painel
          POSTGRES_DB: painel_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U painel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://painel:painel@localhost:5432/painel_teste
      SEGREDO_JWT: segredo-de-ci-com-tamanho-suficiente-para-hs256

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Um passo por comando: num `run` de várias linhas o shell só reporta o
      # código de saída do último, e um `pip install` que falha passaria como
      # sucesso.
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Migrações sobem do zero
        # Migração que só funciona com o banco já existente é migração que
        # falha no primeiro deploy. Aqui ela roda contra um banco vazio.
        run: alembic upgrade head

      - name: Testes
        run: pytest

  web:
    name: TypeScript + build do front (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci || npm install

      # Passo próprio, embora `npm run build` já rode o tsc: separado, o log da
      # CI diz se o que quebrou foi tipo ou empacotamento.
      - name: Verificação de tipos (strict)
        run: npm run typecheck

      - run: npm run build
