# Vigia a produção e, de quebra, atrapalha a hibernação.
#
# A ordem dos objetivos é essa mesmo. O plano gratuito do Render derruba o
# serviço após ~15 min ocioso, e o agendador do GitHub é **melhor esforço**:
# ele atrasa sob carga e não promete pontualidade. Então isto reduz a
# hibernação em horário comercial, não a elimina — quem precisar de garantia
# tem que pagar instância que não dorme.
#
# O que ele **garante** é o alarme. O Postgres gratuito deste projeto expira em
# 04/10/2026 e é apagado, não suspenso. No dia em que isso acontecer, o passo
# de login falha, o GitHub manda e-mail, e o aviso chega sem depender de
# nenhum app estar aberto.
#
# Cuidado conhecido: o GitHub desativa workflows agendados em repositório sem
# atividade por 60 dias. Se o painel parar de ser vigiado, é o primeiro lugar
# para olhar.

name: Monitorar produção

on:
  schedule:
    # A cada 10 min, das 9h às 19h de Brasília, dias úteis. O cron do GitHub é
    # em UTC; o Brasil não tem mais horário de verão, então UTC-3 o ano todo.
    - cron: "*/10 12-22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: monitorar-producao
  cancel-in-progress: true

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      API: https://painel-convertta-api.onrender.com
      WEB: https://painel-convertta-web.onrender.com

    steps:
      # `--max-time 120` porque o primeiro acesso depois da hibernação acorda o
      # contêiner e ainda roda migração e seed antes de responder. Um timeout
      # curto reprovaria justamente o caso que este workflow existe para tratar.
      - name: Acordar a API
        run: curl --fail --silent --show-error --max-time 120 "$API/api/saude"

      - name: Front respondendo
        run: curl --fail --silent --show-error --max-time 120 --output /dev/null "$WEB"

      # O passo que realmente vigia. `/api/saude` responde 200 mesmo com o banco
      # errado ou vazio — ele não consulta nada. O login exerce a cadeia
      # inteira: Postgres de pé, migração aplicada, seed presente, JWT assinando.
      - name: Login da conta demo
        run: |
          codigo=$(curl --silent --output /tmp/token.json --write-out '%{http_code}' \
            --max-time 60 -X POST "$API/api/auth/token" \
            --data-urlencode "username=demo@convertta.com.br" \
            --data-urlencode "password=demo1234")
          if [ "$codigo" != "200" ]; then
            echo "::error::Login devolveu HTTP $codigo. Banco expirado, vazio ou sem seed?"
            cat /tmp/token.json
            exit 1
          fi

      - name: O painel tem dados
        run: |
          token=$(jq -r .access_token /tmp/token.json)
          leads=$(curl --fail --silent --max-time 60 "$API/api/painel/resumo" \
            -H "Authorization: Bearer $token" | jq -r .leads)
          echo "Leads no painel: $leads"
          if [ "$leads" -lt 1 ]; then
            echo "::error::O painel respondeu, mas está sem leads. Banco novo sem seed, ou seed que não rodou."
            exit 1
          fi
